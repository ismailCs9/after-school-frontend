<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After School Classes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .lesson { border: 1px solid #ccc; padding: 10px; margin: 10px 0; width: 300px; }
        .lesson-icon { font-size: 40px; }
    </style>
</head>
<body>
    <div id="app">
        <h1>{{ sitename }}</h1>
        <button @click="toggleCart" :disabled="numberOfItems === 0">
            <i class="fa fa-shopping-cart"></i> Cart ({{ numberOfItems }})
        </button>

        <div v-if="!displayCart">
            <div v-for="lesson in lessons" :key="lesson.id" class="lesson">
                <i :class="'fa ' + lesson.icon + ' lesson-icon'"></i>
                <h2>{{ lesson.subject }}</h2>
                <p>Location: {{ lesson.location }}</p>
                <p>Price: £{{ lesson.price }}</p>
                <p>Spaces left: {{ lesson.spaces }}</p>
                <button @click="addToCart(lesson)" :disabled="!canAddToCart(lesson)">Add to cart</button>
            </div>
        </div>

        <div v-else>
            <h2>Your Cart</h2>
            <div v-for="lesson in cartLessons" :key="lesson.id" class="lesson">
                <i :class="'fa ' + lesson.icon + ' lesson-icon'"></i>
                <h3>{{ lesson.subject }}</h3>
                <p>Location: {{ lesson.location }}</p>
                <p>Price: £{{ lesson.price }}</p>
                <p>Quantity: {{ countInCart(lesson.id) }}</p>
                <button @click="removeFromCart(lesson)">Remove</button>
            </div>
            <p>Checkout coming soon...</p>
        </div>
    </div>

    <script type="module">
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    sitename: "After School Classes",
                    lessons: [
                        { id: 1001, subject: "Maths",    location: "Hendon",        price: 100, spaces: 5, icon: "fa-calculator" },
                        { id: 1002, subject: "English",  location: "Colindale",     price: 90,  spaces: 5, icon: "fa-book" },
                        { id: 1003, subject: "Science",  location: "Brent Cross",   price: 95,  spaces: 5, icon: "fa-flask" },
                        { id: 1004, subject: "Art",      location: "Golders Green", price: 80,  spaces: 5, icon: "fa-paint-brush" },
                        { id: 1005, subject: "Music",    location: "Hendon",        price: 85,  spaces: 5, icon: "fa-music" },
                        { id: 1006, subject: "Football", location: "Colindale",     price: 70,  spaces: 5, icon: "fa-futbol-o" },
                        { id: 1007, subject: "Coding",   location: "Hendon",        price: 120, spaces: 5, icon: "fa-code" },
                        { id: 1008, subject: "Drama",    location: "Brent Cross",   price: 75,  spaces: 5, icon: "fa-microphone" },
                        { id: 1009, subject: "Chess",    location: "Golders Green", price: 60,  spaces: 5, icon: "fa-puzzle-piece" },
                        { id: 1010, subject: "Swimming", location: "Mill Hill",     price: 110, spaces: 5, icon: "fa-tint" }
                    ],
                    cart: [],
                    displayCart: false
                }
            },
            computed: {
                numberOfItems() {
                    return this.cart.length
                },
                cartLessons() {
                    return this.lessons.filter(lesson => this.countInCart(lesson.id) > 0)
                }
            },
            methods: {
                canAddToCart(lesson) {
                    return lesson.spaces > 0
                },
                addToCart(lesson) {
                    this.cart.push(lesson.id)
                    lesson.spaces--
                },
                toggleCart() {
                    this.displayCart = !this.displayCart
                },
                countInCart(id) {
                    return this.cart.filter(item => item === id).length
                },
                removeFromCart(lesson) {
                    const index = this.cart.indexOf(lesson.id)
                    if (index !== -1) {
                        this.cart.splice(index, 1)
                        lesson.spaces++
                    }
                    if (this.cart.length === 0) {
                        this.displayCart = false
                    }
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
