<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After School Classes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .lesson-image { width: 200px; height: auto; }
    </style>
</head>
<body>
    <div id="app">
        <h1>{{ sitename }}</h1>
        <button @click="toggleCart" :disabled="numberOfItems === 0">
            <i class="fa fa-shopping-cart"></i> Cart ({{ numberOfItems }})
        </button>

        <div v-if="!displayCart">
            <img :src="lesson.image" :alt="lesson.imageAlt" class="lesson-image">
            <h2>{{ lesson.subject }}</h2>
            <p>Location: {{ lesson.location }}</p>
            <p>Price: £{{ lesson.price }}</p>
            <p>Spaces left: {{ lesson.spaces }}</p>
            <button @click="addToCart" :disabled="!canAddToCart">Add to cart</button>
        </div>

        <div v-else>
            <h2>Your Cart</h2>
            <p>Checkout coming soon...</p>
        </div>
    </div>

    <script type="module">
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    sitename: "After School Classes",
                    lesson: {
                        id: 1001,
                        subject: "Maths",
                        location: "Hendon",
                        price: 100,
                        spaces: 5,
                        image: "images/maths.jpg",
                        imageAlt: "Open maths textbook with a pen"
                    },
                    cart: [],
                    displayCart: false
                }
            },
            computed: {
                canAddToCart() {
                    return this.lesson.spaces > 0
                },
                numberOfItems() {
                    return this.cart.length
                }
            },
            methods: {
                addToCart() {
                    this.cart.push(this.lesson.id)
                    this.lesson.spaces--
                },
                toggleCart() {
                    this.displayCart = !this.displayCart
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
